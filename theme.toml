name = "ciderui-zola"
description = "apple.com's look for Zola sites, its pages and its news, built on ciderui"
license = "MIT"
homepage = ""
min_version = "0.23.6"
demo = ""

[author]
name = "newlix"
homepage = ""

# The theme's settings, each set in the site's [extra] (Zola lays a site's
# [extra] over these key by key):
# - logo: the global nav's logo, an SVG file in the site (static/logo.svg),
#   drawn inline in currentColor, as ciderui's icons are. Required with a
#   nav.
# - nav: the global nav's links, [{ text, href, flyout? }] (a path in the
#   site, or a URL); [] for no global nav. A link's flyout, a menu under the
#   bar (ciderui's), is its groups, [{ heading, large?, links? }], each
#   [{ text, href }], its large links first. search, bag: the global nav's search and
#   bag pages ("" for none). search_flyout: the nav's search a button
#   opening the search over the page, which sends q to the search page and
#   suggests pages and searches from the site's search index as one types
#   (false: a link to it); search_links, its quick links, [{ text, href }].
#   The flyout needs build_search_index = true and [search] index_format =
#   "fuse_json".
#   A search page of the site's own: a page with template = "search.html",
#   which needs build_search_index = true and [search] index_format =
#   "fuse_json". bag_flyout: the nav's bag a button opening the bag over the
#   page, an empty bag's (false: a link to the bag page): its message
#   bag_message, a line under it bag_line ({ text, href, rest }: a link,
#   then the rest of its sentence; {} for none), and its links bag_links
#   ([{ icon, text, href }], the icon one of ciderui's, orders, saves,
#   account or sign_in) under their heading bag_heading.
# - footer: { copyright, links?, directory?, notes?, shop?, locale? }, the
#   footer's (ciderui's cui-footer: links [{ text, href }]; directory
#   columns of sections [[{ id, title, links }]]; notes and shop HTML;
#   locale { text, href }); {} for no footer.
# - head: tags for every page's <head>, after the theme's, [{ tag, attrs?,
#   content? }].
# - not_found: the 404 page's texts, { headline?, link? }.
[extra]
logo = ""
nav = []
search = ""
search_flyout = false
search_links = []
bag = ""
bag_flyout = false
bag_message = ""
bag_line = {}
bag_heading = ""
bag_links = []
footer = {}
head = []
not_found = {}
